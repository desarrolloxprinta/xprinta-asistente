workflows:
  ios-workflow:
    name: Xprinta Asistente iOS (IPA & TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - ios_credentials
      vars:
        XCODE_WORKSPACE: "ios/XprintaAsistente.xcworkspace"
        XCODE_SCHEME: "XprintaAsistente"
        BUNDLE_ID: "asistentexprinta.xprintapro.com"
        APP_ID_PREFIX: "855K4HU668"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install --legacy-peer-deps
      - name: Prebuild iOS Native Project with Expo
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Set up Code Signing
        script: |
          xcode-project use-profiles || echo "Profiles applied via Codemagic UI"
      - name: Build iOS IPA Package
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" || \
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/ios/xcarchive/XprintaAsistente.xcarchive archive
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

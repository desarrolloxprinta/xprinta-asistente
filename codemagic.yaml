workflows:
  ios-workflow:
    name: Xprinta Asistente iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - xprinta-survey
      vars:
        XCODE_WORKSPACE: "ios/XprintaAsistente.xcworkspace"
        XCODE_SCHEME: "XprintaAsistente"
        BUNDLE_ID: "asistentexprinta.xprintapro.com"
        APP_ID_PREFIX: "855K4HU668"
        DEVELOPMENT_TEAM: "855K4HU668"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch and generate distribution signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "asistentexprinta.xprintapro.com" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Install npm dependencies
        script: |
          npm ci || npm install --legacy-peer-deps
      - name: Prebuild iOS Native Project with Expo
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Apply Code Signing to Xcode project
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA Package
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

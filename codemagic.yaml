workflows:
  ios-workflow:
    name: Xprinta Asistente iOS (IPA & TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - ios_credentials
      vars:
        XCODE_WORKSPACE: "ios/XprintaAsistente.xcworkspace"
        XCODE_SCHEME: "XprintaAsistente"
        BUNDLE_ID: "asistentexprinta.xprintapro.com"
        APP_ID_PREFIX: "855K4HU668"
        DEVELOPMENT_TEAM: "855K4HU668"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install --legacy-peer-deps
      - name: Prebuild iOS Native Project with Expo
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Configure Xcode Project Team ID & Signing
        script: |
          xcode-project use-profiles || echo "Applying team signing configuration..."
      - name: Build iOS IPA Package
        script: |
          xcodebuild             -workspace "$XCODE_WORKSPACE"             -scheme "$XCODE_SCHEME"             -sdk iphoneos             -configuration Release             DEVELOPMENT_TEAM="855K4HU668"             -archivePath build/ios/xcarchive/XprintaAsistente.xcarchive             archive             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO ||           xcode-project build-ipa             --workspace "$XCODE_WORKSPACE"             --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

workflows:
  android-workflow:
    name: Xprinta Asistente Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install --legacy-peer-deps
      - name: Prebuild Android native project
        script: |
          npx expo prebuild --platform android --clean
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  ios-workflow:
    name: Xprinta Asistente iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - ios_credentials
      vars:
        XCODE_WORKSPACE: "ios/XprintaAsistente.xcworkspace"
        XCODE_SCHEME: "XprintaAsistente"
        BUNDLE_ID: "asistentexprinta.xprintapro.com"
        APP_ID_PREFIX: "855K4HU668"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install --legacy-peer-deps
      - name: Prebuild iOS native project
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles || echo "Using manual/ad-hoc profiles if configured"
      - name: Build ipa for distribution
        script: |
          xcodebuild -workspace ios/XprintaAsistente.xcworkspace -scheme XprintaAsistente -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -destination generic/platform=iOS || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

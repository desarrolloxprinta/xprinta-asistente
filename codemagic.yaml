workflows:
  ios-workflow:
    name: Xprinta Asistente iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - xprinta-survey
      vars:
        XCODE_WORKSPACE: "ios/XprintaAsistente.xcworkspace"
        XCODE_SCHEME: "XprintaAsistente"
        BUNDLE_ID: "asistentexprinta.xprintapro.com"
        APP_ID_PREFIX: "855K4HU668"
        DEVELOPMENT_TEAM: "855K4HU668"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch or use Provisioning Profile
        script: |
          # If App Store Connect credentials are valid, fetch them dynamically
          if [[ -n "$APP_STORE_CONNECT_PRIVATE_KEY" && "$APP_STORE_CONNECT_PRIVATE_KEY" != *"*"* ]]; then
            app-store-connect fetch-signing-files "asistentexprinta.xprintapro.com" --type IOS_APP_STORE --create || true
          fi
          # Install local provision profile for asistentexprinta.xprintapro.com
          if [ -f "xprintaasistente.mobileprovision" ]; then
            echo "Installing bundled xprintaasistente.mobileprovision..."
            PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILES_DIR"
            PROFILE_UUID=$(grep -A1 -a UUID xprintaasistente.mobileprovision | grep -o "[-a-zA-Z0-9]\{36\}")
            cp xprintaasistente.mobileprovision "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
            echo "Installed profile UUID: $PROFILE_UUID"
          fi
      - name: Add certificates to keychain
        script: |
          keychain add-certificates || true
      - name: Install npm dependencies
        script: |
          npm ci || npm install --legacy-peer-deps
      - name: Prebuild iOS Native Project with Expo
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Apply Code Signing to Xcode project
        script: |
          xcode-project use-profiles || echo "Profiles applied"
      - name: Build iOS IPA Package
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

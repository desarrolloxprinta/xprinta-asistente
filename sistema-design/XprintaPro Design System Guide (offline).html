  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

72A;\n    --n900: #18181B;\n    --font-sans: \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n    --font-serif: \"Merriweather\", Georgia, serif;\n  }\n\n  * { box-sizing: border-box; }\n\n  doc-page {\n    font-family: var(--font-sans);\n    color: var(--xp-ink);\n    -webkit-font-smoothing: antialiased;\n    line-height: 1.6;\n  }\n\n  /* ---- Type primitives ---- */\n  .eyebrow {\n    font-size: 11.5px;\n    font-weight: 600;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--xp-orange);\n    margin: 0 0 14px;\n  }\n  .eyebrow.muted { color: var(--n400); }\n\n  h1, h2, h3 { font-weight: 300; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }\n  h2 { font-size: 34px; margin: 0 0 6px; }\n  h2 em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--n500); }\n  h3 { font-size: 19px; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 10px; }\n  p { margin: 0 0 12px; color: var(--n700); font-size: 13.5px; }\n  .lead { font-size: 15px; color: var(--n700); line-height: 1.65; }\n\n  .section { margin: 0 0 56px; }\n  .section-head { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--n200); padding-bottom: 18px; margin-bottom: 28px; }\n  .section-idx { font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; color: var(--n400); white-space: nowrap; }\n\n  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }\n\n  /* ---- Cover ---- */\n  .cover { min-height: 9in; display: flex; flex-direction: column; justify-content: space-between; }\n  .cover-top { display: flex; justify-content: space-between; align-items: flex-start; }\n  .cover-logo { height: 46px; }\n  .cover-meta { text-align: right; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--n400); line-height: 1.9; }\n  .cover-title { font-size: 76px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.02; margin: 0 0 18px; }\n  .cover-title em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--xp-orange); }\n  .cover-sub { font-size: 17px; color: var(--n500); max-width: 30em; line-height: 1.6; }\n  .cover-rule { height: 4px; width: 64px; background: var(--xp-orange); margin: 0 0 26px; }\n  .cover-foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--n400); border-top: 1px solid var(--n200); padding-top: 20px; }\n\n  /* ---- Color ---- */\n  .swatch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }\n  .swatch { border: 1px solid var(--n200); border-radius: 12px; overflow: hidden; }\n  .swatch .chip { height: 72px; }\n  .swatch .info { padding: 10px 12px 12px; }\n  .swatch .name { font-size: 12px; font-weight: 600; margin: 0 0 2px; color: var(--xp-ink); }\n  .swatch .hex { font-family: \"SFMono-Regular\", ui-monospace, Menlo, monospace; font-size: 11px; color: var(--n500); text-transform: uppercase; }\n  .swatch .var { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--n400); margin-top: 3px; }\n  .neutral-bar { display: flex; border-radius: 12px; overflow: hidden; border: 1px solid var(--n200); margin-top: 18px; }\n  .neutral-bar .n { flex: 1; height: 56px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 9px; }\n\n  /* ---- Type specimen ---- */\n  .spec-row { display: grid; grid-template-columns: 96px 1fr; gap: 20px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--n200); }\n  .spec-label { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--n400); line-height: 1.5; padding-top: 6px; }\n  .spec-sample { color: var(--xp-ink); }\n\n  /* ---- Scale / radii / motion tables ---- */\n  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; font-size: 12.5px; }\n  .kv .k { color: var(--n700); }\n  .kv .k b { font-weight: 600; color: var(--xp-ink); }\n  .kv .v { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--n500); text-align: right; }\n  .kv > div { padding: 7px 0; border-bottom: 1px solid var(--n200); }\n\n  .radii-row { display: flex; gap: 16px; align-items: flex-end; }\n  .radii-item { text-align: center; }\n  .radii-box { width: 60px; height: 60px; background: var(--xp-ink); border: 1px solid var(--n800); }\n  .radii-cap { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--n500); margin-top: 8px; }\n\n  /* ---- Components ---- */\n  .comp-showcase { border: 1px solid var(--n200); border-radius: 16px; padding: 26px; background: #fff; }\n  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-sans); font-weight: 600; font-size: 13px; letter-spacing: -0.01em; border-radius: 9999px; padding: 12px 24px; border: 1px solid transparent; cursor: default; }\n  .btn-primary { background: var(--xp-orange); color: #fff; }\n  .btn-dark { background: var(--xp-ink); color: #fff; }\n  .btn-outline { background: transparent; color: var(--xp-ink); border-color: var(--xp-ink); }\n  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }\n\n  .badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 9999px; }\n  .badge-accent { background: var(--xp-orange-100); color: var(--xp-orange-600); }\n  .badge-dark { background: var(--xp-ink); color: #fff; }\n  .badge-ghost { background: transparent; color: var(--n500); border: 1px solid var(--n300); }\n\n  .sector-card { position: relative; border-radius: 24px; overflow: hidden; height: 168px; background: var(--xp-ink); }\n  .sector-card .ov { position: absolute; inset: 0; background: rgba(0,0,0,0.55); }\n  .sector-card .idx { position: absolute; top: 16px; left: 18px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: rgba(255,255,255,0.7); }\n  .sector-card .ttl { position: absolute; bottom: 18px; left: 18px; font-size: 22px; font-weight: 300; color: #fff; letter-spacing: -0.01em; }\n  .sector-card img { width: 100%; height: 100%; object-fit: cover; }\n\n  .comp-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }\n  .comp-list .item { padding: 11px 0; border-bottom: 1px solid var(--n200); font-size: 12.5px; }\n  .comp-list .item b { font-weight: 600; }\n  .comp-list .item span { color: var(--n500); }\n\n  .field-demo { max-width: 260px; }\n  .field-demo label { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--n500); margin-bottom: 6px; }\n  .field-demo .line { border: 0; border-bottom: 1.5px solid var(--n300); padding: 6px 0; font-size: 14px; color: var(--n400); }\n  .field-demo .line.focus { border-bottom-color: var(--xp-orange); color: var(--xp-ink); }\n\n  .note { font-size: 12px; color: var(--n500); background: var(--xp-paper); border-radius: 10px; padding: 14px 16px; border-left: 3px solid var(--xp-orange); }\n\n  .caption { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--n400); margin-top: 8px; }\n\n  .running { display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--n400); }\n  .running img { height: 16px; opacity: 0.85; }\n\n  @media print {\n    .swatch, .comp-showcase, .sector-card, .spec-row, .kv > div { break-inside: avoid; }\n    .section { break-inside: avoid-page; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<doc-page size=\"letter\" margin=\"0.7in\">\n\n  <div slot=\"footer\" class=\"running\">\n    <span>XprintaPro · Sistema de Diseño<\u002Fspan>\n    <span>Trade Marketing &amp; Corporate Visual Identity<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ============ COVER ============ -->\n  <div class=\"cover\">\n    <div class=\"cover-top\">\n      <img class=\"cover-logo\" src=\"41db8056-71e4-411d-b3e0-6a3d87418099\" alt=\"XprintaPro\">\n      <div class=\"cover-meta\">\n        Design System<br>Versión 1.0<br>Julio 2026\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div class=\"cover-rule\"><\u002Fdiv>\n      <p class=\"eyebrow\">Guía de Identidad · Sistema de Diseño<\u002Fp>\n      <h1 class=\"cover-title\">El sistema<br>que <em>construye<\u002Fem><br>la marca<\u002Fh1>\n      <p class=\"cover-sub\">Fundamentos visuales, tono de voz y componentes de XprintaPro — <em style=\"font-family:var(--font-serif);font-style:italic\">your GRAPHIC extension<\u002Fem>. Todo lo necesario para reproducir la marca de forma coherente en cualquier plataforma.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"cover-foot\">\n      <span>Color · Tipografía · Espaciado · Componentes · Voz<\u002Fspan>\n      <span>new.xprintapro.com<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 01 ESSENCE ============ -->\n  <div class=\"section\" style=\"margin-top:56px;\">\n    <div class=\"section-head\">\n      <span class=\"section-idx\">01 / FUNDAMENTO<\u002Fspan>\n      <h2>La esencia de <em>la marca<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"two-col\">\n      <div>\n        <p class=\"lead\">XprintaPro implanta la imagen de marca en espacios retail y corporativos en toda España: rotulación, gráfica de tienda y despliegue de identidad visual, con fabricación propia, logística y más de 50 delegaciones.<\u002Fp>\n        <p>El lenguaje visual es <b>minimalista y de alto contraste<\u002Fb>: negro casi puro y blanco, con un único naranja cálido como acento. Tipografía display ligera y de gran tamaño, con una línea editorial en Merriweather itálica.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3>Voz y tono<\u002Fh3>\n        <p>Corporativo, seguro, técnico pero cercano. Vende capacidad y escala nacional. Frases declarativas y orientadas al beneficio, nunca frívolas.<\u002Fp>\n        <div class=\"note\" style=\"margin-top:16px;\">\n          <b>Dispositivo de firma:<\u002Fb> índices numerados de sección — <b>01 / Aplicaciones<\u002Fb> — y titulares de dos líneas donde la segunda es un acento itálico en gris. Sustantivos clave resaltados en naranja dentro del titular.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 02 COLOR ============ -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <span class=\"section-idx\">02 / COLOR<\u002Fspan>\n      <h2>Un acento, <em>alto contraste<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"lead\" style=\"margin-bottom:24px;\">Sistema restringido: tinta casi negra, blanco y una escala neutra de grises, con un único naranja de marca. El naranja se usa con moderación — eyebrows, resaltados, botones primarios, focus.<\u002Fp>\n\n    <div class=\"swatch-grid\">\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background:#F18108;\"><\u002Fdiv>\n        <div class=\"info\"><p class=\"name\">Naranja marca<\u002Fp><span class=\"hex\">#F18108<\u002Fspan><div class=\"var\">--xp-orange<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background:#D97307;\"><\u002Fdiv>\n        <div class=\"info\"><p class=\"name\">Naranja hover<\u002Fp><span class=\"hex\">#D97307<\u002Fspan><div class=\"var\">--xp-orange-600<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background:#0A0A0A;\"><\u002Fdiv>\n        <div class=\"info\"><p class=\"name\">Tinta<\u002Fp><span class=\"hex\">#0A0A0A<\u002Fspan><div class=\"var\">--xp-ink<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background:#F4F4F5;border-bottom:1px solid #E4E4E7;\"><\u002Fdiv>\n        <div class=\"info\"><p class=\"name\">Papel<\u002Fp><span class=\"hex\">#F4F4F5<\u002Fspan><div class=\"var\">--xp-paper<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p class=\"eyebrow muted\" style=\"margin:26px 0 10px;\">Escala neutra · Zinc<\u002Fp>\n    <div class=\"neutral-bar\">\n      <div class=\"n\" style=\"background:#FAFAFA;color:#71717A;\">50<\u002Fdiv>\n      <div class=\"n\" style=\"background:#F4F4F5;color:#71717A;\">100<\u002Fdiv>\n      <div class=\"n\" style=\"background:#E4E4E7;color:#71717A;\">200<\u002Fdiv>\n      <div class=\"n\" style=\"background:#D4D4D8;color:#3F3F46;\">300<\u002Fdiv>\n      <div class=\"n\" style=\"background:#A1A1AA;color:#fff;\">400<\u002Fdiv>\n      <div class=\"n\" style=\"background:#71717A;color:#fff;\">500<\u002Fdiv>\n      <div class=\"n\" style=\"background:#52525B;color:#fff;\">600<\u002Fdiv>\n      <div class=\"n\" style=\"background:#3F3F46;color:#fff;\">700<\u002Fdiv>\n      <div class=\"n\" style=\"background:#27272A;color:#fff;\">800<\u002Fdiv>\n      <div class=\"n\" style=\"background:#18181B;color:#fff;\">900<\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"caption\">Sin gradientes decorativos · Sin acentos secundarios · Naranja tint #FDEBD3 para washes · Éxito #34B257<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ============ 03 TYPOGRAPHY ============ -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <span class=\"section-idx\">03 / TIPOGRAFÍA<\u002Fspan>\n      <h2>Inter, con acento <em>editorial<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"lead\" style=\"margin-bottom:8px;\">Inter para todo; Merriweather itálica como acento editorial en titulares de dos líneas. Los display son ligeros (300), grandes y muy ajustados (-0.02em).<\u002Fp>\n\n    <div class=\"spec-row\">\n      <div class=\"spec-label\">Hero · 80px<br>light · -0.02em<\u002Fdiv>\n      <div class=\"spec-sample\" style=\"font-size:52px;font-weight:300;letter-spacing:-0.02em;line-height:1;\">Imagen de marca<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec-row\">\n      <div class=\"spec-label\">Display · 64px<br>light · -0.02em<\u002Fdiv>\n      <div class=\"spec-sample\" style=\"font-size:40px;font-weight:300;letter-spacing:-0.02em;\">Sectores de <em style=\"font-family:var(--font-serif);font-style:italic;color:var(--n500);\">Especialización<\u002Fem><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec-row\">\n      <div class=\"spec-label\">Eyebrow · 13.6px<br>semibold · 0.17em<\u002Fdiv>\n      <div class=\"spec-sample eyebrow\" style=\"margin:0;\">01 / Aplicaciones<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec-row\">\n      <div class=\"spec-label\">Lead · 20px<br>regular · 1.6<\u002Fdiv>\n      <div class=\"spec-sample\" style=\"font-size:17px;color:var(--n700);\">Fabricación propia, logística y cobertura nacional para grandes proyectos.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec-row\">\n      <div class=\"spec-label\">Body · 16px<br>regular · 1.6<\u002Fdiv>\n      <div class=\"spec-sample\" style=\"font-size:14px;color:var(--n700);\">Transforma la identidad de tu marca con máxima calidad y precisión técnica.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"two-col\" style=\"margin-top:28px;\">\n      <div>\n        <h3>Familias<\u002Fh3>\n        <div class=\"kv\">\n          <div class=\"k\"><b>Inter<\u002Fb> — sans principal<\u002Fdiv><div class=\"v\">300–800<\u002Fdiv>\n          <div class=\"k\"><b>Merriweather<\u002Fb> — acento itálico<\u002Fdiv><div class=\"v\">400 italic<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h3>Escala &amp; espaciado de letra<\u002Fh3>\n        <div class=\"kv\">\n          <div class=\"k\">Display / Hero tracking<\u002Fdiv><div class=\"v\">-0.02em<\u002Fdiv>\n          <div class=\"k\">Eyebrow tracking<\u002Fdiv><div class=\"v\">0.17em<\u002Fdiv>\n          <div class=\"k\">Line-height display / body<\u002Fdiv><div class=\"v\">1.1 / 1.6<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 04 SPACING ============ -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <span class=\"section-idx\">04 / ESPACIO &amp; FORMA<\u002Fspan>\n      <h2>Ritmo <em>generoso<\u002Fem>, formas suaves<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"two-col\">\n      <div>\n        <h3>Escala de espaciado<\u002Fh3>\n        <p style=\"font-size:12.5px;\">Base 4px. El ritmo vertical de sección es amplio (128px). Contenedor máx. 1440px con padding lateral de ~96px.<\u002Fp>\n        <div class=\"kv\" style=\"margin-top:8px;\">\n          <div class=\"k\">4 · 8 · 12 · 16<\u002Fdiv><div class=\"v\">micro<\u002Fdiv>\n          <div class=\"k\">23 · 32 · 48 · 64<\u002Fdiv><div class=\"v\">bloque<\u002Fdiv>\n          <div class=\"k\">96 · 128<\u002Fdiv><div class=\"v\">sección<\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"margin-top:24px;\">Sombras &amp; motion<\u002Fh3>\n        <div class=\"kv\">\n          <div class=\"k\">Card<\u002Fdiv><div class=\"v\">0 8px 24px /.08<\u002Fdiv>\n          <div class=\"k\">Navbar<\u002Fdiv><div class=\"v\">0 10px 40px /.08<\u002Fdiv>\n          <div class=\"k\">Ease-out<\u002Fdiv><div class=\"v\">.16,1,.3,1<\u002Fdiv>\n          <div class=\"k\">Duración<\u002Fdiv><div class=\"v\">160/280/500ms<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h3>Radios de esquina<\u002Fh3>\n        <div class=\"radii-row\" style=\"margin-top:14px;\">\n          <div class=\"radii-item\"><div class=\"radii-box\" style=\"border-radius:8px;\"><\u002Fdiv><div class=\"radii-cap\">8 · sm<\u002Fdiv><\u002Fdiv>\n          <div class=\"radii-item\"><div class=\"radii-box\" style=\"border-radius:16px;\"><\u002Fdiv><div class=\"radii-cap\">16 · md<\u002Fdiv><\u002Fdiv>\n          <div class=\"radii-item\"><div class=\"radii-box\" style=\"border-radius:24px;\"><\u002Fdiv><div class=\"radii-cap\">24 · lg<\u002Fdiv><\u002Fdiv>\n          <div class=\"radii-item\"><div class=\"radii-box\" style=\"border-radius:9999px;\"><\u002Fdiv><div class=\"radii-cap\">full<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"note\" style=\"margin-top:22px;\">\n          <b>Bordes hairline 1px.<\u002Fb> Superficies claras #E4E4E7; superficies oscuras #27272A. Los campos de formulario usan una sola regla inferior que se vuelve naranja al foco.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 05 COMPONENTS ============ -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <span class=\"section-idx\">05 / COMPONENTES<\u002Fspan>\n      <h2>Piezas del <em>sistema<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"two-col\" style=\"margin-bottom:24px;\">\n      <div class=\"comp-showcase\">\n        <p class=\"eyebrow muted\" style=\"margin-bottom:16px;\">Botones · pill radius full<\u002Fp>\n        <div class=\"btn-row\">\n          <span class=\"btn btn-primary\">Empezar proyecto →<\u002Fspan>\n          <span class=\"btn btn-dark\">Ver más<\u002Fspan>\n          <span class=\"btn btn-outline\">Contacto<\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"eyebrow muted\" style=\"margin:22px 0 12px;\">Badges<\u002Fp>\n        <div class=\"btn-row\">\n          <span class=\"badge badge-accent\">Nacional<\u002Fspan>\n          <span class=\"badge badge-dark\">+50 sedes<\u002Fspan>\n          <span class=\"badge badge-ghost\">Retail<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"comp-showcase\">\n        <p class=\"eyebrow muted\" style=\"margin-bottom:16px;\">Campo · regla inferior al foco<\u002Fp>\n        <div class=\"field-demo\">\n          <label>Nombre<\u002Flabel>\n          <div class=\"line\">Marca / empresa<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field-demo\" style=\"margin-top:18px;\">\n          <label style=\"color:var(--xp-orange);\">Email<\u002Flabel>\n          <div class=\"line focus\">hola@tumarca.com<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"two-col\" style=\"margin-bottom:24px;\">\n      <div class=\"sector-card\">\n        <img src=\"c5d3e55d-2ef1-40b3-8950-af269e2b3321\" alt=\"\" onerror=\"this.style.display='none'\">\n        <div class=\"ov\"><\u002Fdiv>\n        <span class=\"idx\">01<\u002Fspan>\n        <span class=\"ttl\">Retail<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"sector-card\">\n        <img src=\"016a1421-441f-4541-af13-645d40096db7\" alt=\"\" onerror=\"this.style.display='none'\">\n        <div class=\"ov\"><\u002Fdiv>\n        <span class=\"idx\">02<\u002Fspan>\n        <span class=\"ttl\">Corporativo<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"caption\" style=\"margin-bottom:24px;\">Sector cards — imagen a sangre bajo overlay negro, índice arriba-izquierda, título grande abajo. Hover: zoom 1.06 + overlay más claro.<\u002Fp>\n\n    <h3>Catálogo de componentes<\u002Fh3>\n    <div class=\"comp-list\">\n      <div class=\"item\"><b>Button<\u002Fb> <span>— CTA pill (primary / dark / outline)<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>Badge<\u002Fb> <span>— etiqueta pill<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>Card<\u002Fb> <span>— panel claro / oscuro / ghost<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>Eyebrow<\u002Fb> <span>— label índice de sección<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>SectionHeading<\u002Fb> <span>— titular display 2 líneas<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>SectorCard<\u002Fb> <span>— tile de imagen con overlay<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>StatBlock / FeatureStat<\u002Fb> <span>— datos y cifras<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>Field<\u002Fb> <span>— input / textarea / select underline<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>Navbar<\u002Fb> <span>— pill flotante translúcido<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>Footer<\u002Fb> <span>— chrome oscuro<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>ProcessStep<\u002Fb> <span>— paso de metodología<\u002Fspan><\u002Fdiv>\n      <div class=\"item\"><b>LogoMarquee<\u002Fb> <span>— cinta de clientes<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 06 IMAGERY ============ -->\n  <div class=\"section\" style=\"margin-bottom:0;\">\n    <div class=\"section-head\">\n      <span class=\"section-idx\">06 / IMAGEN &amp; ICONOGRAFÍA<\u002Fspan>\n      <h2>Fotografía <em>real<\u002Fem>, casi sin iconos<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"two-col\">\n      <div>\n        <h3>Fotografía<\u002Fh3>\n        <p>Real, cálida, arquitectónica — rótulos iluminados, escaparates, espacios industriales. Color, a menudo al anochecer, siempre bajo overlay negro sólido (rgba(0,0,0,.8)) para que el display blanco sea legible. Sin texturas, sin patrones, sin ilustración.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3>Iconografía<\u002Fh3>\n        <p>La marca es <b>casi sin iconos<\u002Fb>: el significado lo llevan la tipografía, los índices numerados y la fotografía. El único glifo recurrente es la flecha <b>→<\u002Fb> en los CTA. Sin emoji.<\u002Fp>\n        <div class=\"note\" style=\"margin-top:14px;\">Si un producto necesita iconos UI, usar <b>Lucide<\u002Fb> con trazo 1.5–2px en tinta o gris — nunca naranja salvo acción primaria.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdoc-page>\n<script src=\"dbb1b53a-e2f3-4a92-8e81-9d62467c9528\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
